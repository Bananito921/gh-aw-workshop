<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"
     role="img"
     aria-label="Agentic workflows as an Actions-compatible superset, shown as three stacked layers. The base layer is the GitHub Actions foundation: triggers, permissions, runners, and pull-request review. The middle layer is frontmatter, which stays compatible with that foundation. The top layer is the Markdown task brief, which adds agentic reasoning on top without replacing the layers below."
     data-visual-kind="diagram"
     data-visual-id="sq0501-superset-layers">

  <!-- Background -->
  <rect width="1200" height="560" fill="#f2f5f3"/>

  <!-- Title -->
  <text x="600" y="44" text-anchor="middle"
        font-family="'Mona Sans','Segoe UI',system-ui,sans-serif"
        font-size="22" font-weight="700" fill="#101411">Agentic Workflows: an Actions-Compatible Superset</text>
  <text x="600" y="68" text-anchor="middle"
        font-family="'Mona Sans','Segoe UI',system-ui,sans-serif"
        font-size="14" fill="#232925">Each layer builds on the one below it — nothing from Actions is replaced</text>

  <!-- Reading direction annotation (numbered, bottom-to-top) -->

  <!-- Layer 1 (base): GitHub Actions Foundation -->
  <g data-node="actions-foundation">
    <rect x="140" y="392" width="920" height="106" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <circle cx="184" cy="392" r="18" fill="#08872b"/>
    <text x="184" y="398" text-anchor="middle"
          font-family="'Mona Sans','Segoe UI',system-ui,sans-serif"
          font-size="14" font-weight="700" fill="#ffffff">1</text>
    <text x="220" y="424"
          font-family="'Mona Sans','Mona Sans Mono',monospace"
          font-size="16" font-weight="700" fill="#101411">GitHub Actions Foundation</text>
    <text x="220" y="446"
          font-family="'Mona Sans','Segoe UI',system-ui,sans-serif"
          font-size="13" fill="#232925">triggers · permissions · runners · repo context · PR review flow</text>
    <rect x="220" y="458" width="190" height="26" rx="13" fill="#f2f5f3" stroke="#b6bfb8" stroke-width="1"/>
    <text x="315" y="475" text-anchor="middle"
          font-family="'Mona Sans Mono',monospace" font-size="11" fill="#232925">on: schedule / push</text>
    <rect x="424" y="458" width="150" height="26" rx="13" fill="#f2f5f3" stroke="#b6bfb8" stroke-width="1"/>
    <text x="499" y="475" text-anchor="middle"
          font-family="'Mona Sans Mono',monospace" font-size="11" fill="#232925">runs-on: ubuntu</text>
    <rect x="588" y="458" width="180" height="26" rx="13" fill="#f2f5f3" stroke="#b6bfb8" stroke-width="1"/>
    <text x="678" y="475" text-anchor="middle"
          font-family="'Mona Sans Mono',monospace" font-size="11" fill="#232925">permissions: contents</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="600" y1="392" x2="600" y2="352" stroke="#08872b" stroke-width="3" stroke-linecap="round"/>
  <polygon points="600,352 594,363 606,363" fill="#08872b"/>

  <!-- Layer 2 (middle): Frontmatter -->
  <g data-node="frontmatter">
    <rect x="200" y="246" width="800" height="106" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <circle cx="244" cy="246" r="18" fill="#08872b"/>
    <text x="244" y="252" text-anchor="middle"
          font-family="'Mona Sans','Segoe UI',system-ui,sans-serif"
          font-size="14" font-weight="700" fill="#ffffff">2</text>
    <text x="280" y="278"
          font-family="'Mona Sans','Mona Sans Mono',monospace"
          font-size="16" font-weight="700" fill="#101411">Frontmatter</text>
    <text x="280" y="300"
          font-family="'Mona Sans','Segoe UI',system-ui,sans-serif"
          font-size="13" fill="#232925">stays compatible with the Actions model you already know</text>
    <rect x="280" y="312" width="150" height="26" rx="13" fill="#f2f5f3" stroke="#b6bfb8" stroke-width="1"/>
    <text x="355" y="329" text-anchor="middle"
          font-family="'Mona Sans Mono',monospace" font-size="11" fill="#232925">on: [issues]</text>
    <rect x="444" y="312" width="180" height="26" rx="13" fill="#f2f5f3" stroke="#b6bfb8" stroke-width="1"/>
    <text x="534" y="329" text-anchor="middle"
          font-family="'Mona Sans Mono',monospace" font-size="11" fill="#232925">safe-outputs: add-label</text>
    <rect x="638" y="312" width="130" height="26" rx="13" fill="#f2f5f3" stroke="#b6bfb8" stroke-width="1"/>
    <text x="703" y="329" text-anchor="middle"
          font-family="'Mona Sans Mono',monospace" font-size="11" fill="#232925">engine: copilot</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="600" y1="246" x2="600" y2="206" stroke="#08872b" stroke-width="3" stroke-linecap="round"/>
  <polygon points="600,206 594,217 606,217" fill="#08872b"/>

  <!-- Layer 3 (top): Markdown Task Brief -->
  <g data-node="task-brief">
    <rect x="260" y="100" width="680" height="106" rx="10" fill="#0a241b" stroke="#08872b" stroke-width="2"/>
    <circle cx="304" cy="100" r="18" fill="#5fed83"/>
    <text x="304" y="106" text-anchor="middle"
          font-family="'Mona Sans','Segoe UI',system-ui,sans-serif"
          font-size="14" font-weight="700" fill="#101411">3</text>
    <text x="340" y="132"
          font-family="'Mona Sans','Mona Sans Mono',monospace"
          font-size="16" font-weight="700" fill="#5fed83">Markdown Task Brief</text>
    <text x="340" y="154"
          font-family="'Mona Sans','Segoe UI',system-ui,sans-serif"
          font-size="13" fill="#f2f5f3">adds agentic reasoning and templating on top — nothing below is replaced</text>
    <rect x="340" y="166" width="560" height="26" rx="6" fill="#101411" stroke="#5fed83" stroke-width="1"/>
    <text x="620" y="183" text-anchor="middle"
          font-family="'Mona Sans','Segoe UI',system-ui,sans-serif" font-size="11" fill="#f2f5f3">"Read the opened issue and apply the single most relevant label."</text>
  </g>

  <!-- Bottom annotation -->
  <text x="600" y="536" text-anchor="middle"
        font-family="'Mona Sans','Segoe UI',system-ui,sans-serif"
        font-size="13" fill="#232925">Read bottom to top: the Actions foundation stays intact, frontmatter keeps it configurable, and the task brief adds reasoning.</text>
</svg>
